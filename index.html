    <!-- DOM SHIELD v3 SYNCHRONE ULTRA-SÉCURISÉ -->
    <script>
      (function() {
        if (typeof Node === 'undefined' || !Node.prototype) return;
        
        var _origInsert = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, refNode) {
          if (refNode && refNode.parentNode !== this) {
            try {
              return _origInsert.call(this, newNode, null);
            } catch (e) {
              return newNode;
            }
          }
          try {
            return _origInsert.call(this, newNode, refNode);
          } catch (err) {
            try {
              return _origInsert.call(this, newNode, null);
            } catch (fallbackErr) {
              return newNode;
            }
          }
        };

        var _origRemove = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child && child.parentNode !== this) {
            return child;
          }
          try {
            return _origRemove.call(this, child);
          } catch (err) {
            return child;
          }
        };
      })();
    </script>
